      - AWS_CLOUDFRONT_DOMAIN_VIDEOS=${aws_cloudfront_domain_videos_env}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-global:5432/videodb
      - SPRING_CLOUD_CONSUL_HOST=consul
      - MINIO_URL=http://minio:9000
      - STORAGE_TYPE=aws
      - RABBIT_HOST=rabbitmq-teakter
      - RABBIT_USER=guest
      - RABBIT_PASSWORD=guest
    deploy:
