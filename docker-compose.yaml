  rabbitmq:
    networks:
      - teakter-network
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-teakter
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
#      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 384M

  #microservicio auth
  auth-service:
    networks:
      - teakter-network
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth-microservice
    depends_on:
      db-global:
        condition: service_healthy
      consul:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m -XX:+UseG1GC
      - user_db=${user_db_env}
      - password_db=${password_db_env}
      - JWT_SECRET=${jwt_secret_env}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-global:5432/authdb
      - SPRING_CLOUD_CONSUL_HOST=consul
      - RABBIT_HOST=rabbitmq-teakter
      - RABBIT_USER=guest
      - RABBIT_PASSWORD=guest
    deploy:
      resources:
        limits:
          memory: 512m

