networks:
  teakter-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:

services:
  # Base de Datos
  db-global:
    networks:
      - teakter-network
    image: postgres:15-alpine
    container_name: postgres-teakter
    environment:
      POSTGRES_USER: ${user_db_env}
      POSTGRES_PASSWORD: ${password_db_env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

# Consul
  consul:
    networks:
      - teakter-network
    image: hashicorp/consul:1.15
    container_name: consul-server
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 256M

