# 1. Base de Datos en memoria (H2) para que no busque PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivar completamente Consul durante los tests de Spring Boot Context
spring.cloud.consul.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.cloud.consul.discovery.register=false
spring.cloud.consul.config.enabled=false
spring.cloud.discovery.enabled=false
  spring.config.import=

# 3. Valores ficticios para las variables obligatorias (${...})
jwt.secret=mi-secreto-de-prueba-que-debe-ser-largo-para-no-dar-error
user_db=test
password_db=test
JWT_SECRET=mi-secreto-de-prueba-que-debe-ser-largo-para-no-dar-error
AWS_ACCESS_KEY=fake-key
AWS_SECRET_KEY=fake-secret
MINIO_ACCESS_KEY=fake-key
MINIO_SECRET_KEY=fake-secret

# 4. Propiedades de negocio para que los @Value no sean null
aws.s3.bucket-name=test-bucket
aws.s3.region=us-east-1
minio.url=http://localhost:9000
minio.bucket-name=test-bucket
storage.type=minio